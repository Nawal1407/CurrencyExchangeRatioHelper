<!DOCTYPE html>
<html>
<head>
  <title>PoE Ratio Calculator</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: auto; padding: 20px; }
    input { width: 100%; padding: 8px; margin: 6px 0; }
    button { padding: 10px 20px; margin-top: 10px; }
    .result { margin-top: 20px; padding: 10px; background: #eee; }
  </style>
</head>
<body>

<h2>Path of Exile Ratio Calculator</h2>

<label>Ratio (example: 10:1 or 1.78:1)</label>
<input id="ratio" placeholder="10:1">

<label>How many items do you have?</label>
<input id="items" type="number" placeholder="200">

<button onclick="calculate()">Calculate</button>

<div id="output" class="result"></div>

<script>
function calculate() {
    const ratioInput = document.getElementById("ratio").value;
    const items = parseFloat(document.getElementById("items").value);

    if (!ratioInput.includes(":")) {
        document.getElementById("output").innerHTML = "Invalid ratio format.";
        return;
    }

    let [want, offer] = ratioInput.split(":").map(Number);

    // Convert decimal ratio into exact whole-number ratio
    function toWhole(a, b) {
        const aDec = (a.toString().split(".")[1] || "").length;
        const bDec = (b.toString().split(".")[1] || "").length;
        const scale = Math.pow(10, Math.max(aDec, bDec));
        return [a * scale, b * scale];
    }

    // If either side is decimal, convert to whole-number ratio
    if (!Number.isInteger(want) || !Number.isInteger(offer)) {
        [want, offer] = toWhole(want, offer);
    }

    // Now offer is guaranteed whole-number
    const maxBlocks = Math.floor(items / offer);

    if (maxBlocks < 1) {
        document.getElementById("output").innerHTML = `
            <h3>Results</h3>
            You do not have enough items to complete even one trade block.
        `;
        return;
    }

    const lowestBlocks = 1;
    const middleBlocks = Math.floor(maxBlocks / 2);
    const highestBlocks = maxBlocks;

    function trade(blocks) {
        return {
            offerItems: blocks * offer,
            receiveItems: blocks * want
        };
    }

    const low = trade(lowestBlocks);
    const mid = trade(middleBlocks);
    const high = trade(highestBlocks);

    const remainder = items - high.offerItems;

    document.getElementById("output").innerHTML = `
      <h3>Results</h3>

      <b>Ratio:</b> ${ratioInput} → closest whole-number ratio ${want}:${offer}<br><br>

      <b>Lowest trade (1 block):</b><br>
      Offer: ${low.offerItems}<br>
      Receive: ${low.receiveItems}<br><br>

      <b>Middle trade (${middleBlocks} blocks):</b><br>
      Offer: ${mid.offerItems}<br>
      Receive: ${mid.receiveItems}<br><br>

      <b>Highest trade (${highestBlocks} blocks):</b><br>
      Offer: ${high.offerItems}<br>
      Receive: ${high.receiveItems}<br><br>

      <b>Remainder:</b> ${remainder} items cannot be traded.
    `;
}
</script>
</body>
</html>
