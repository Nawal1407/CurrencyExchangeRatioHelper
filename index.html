<body>
  <div class="window">

    <div class="title-bar">
      CURRENCY EXCHANGE CALCULATOR
    </div>

    <div class="section">
      <h2>Desired Ratio</h2>

      <div class="ratio-boxes">

        <div class="ratio-panel">
          <div class="panel-title">I WANT</div>
          <input id="want" type="number" value="1">
          <div class="modified-label">Modified:</div>
          <div id="wantModified" class="modified-value">1</div>
        </div>

        <div class="ratio-separator">:</div>

        <div class="ratio-panel">
          <div class="panel-title">I HAVE</div>
          <input id="offer" type="number" step="0.01" value="2.8">
          <div class="modified-label">Modified:</div>
          <div id="offerModified" class="modified-value">2.8</div>
        </div>

      </div>

      <div class="slider-box">
        <label>Adjust Ratio</label>
        <input id="ratioSlider" type="range" min="-50" max="50" value="0">
      </div>
    </div>

    <div class="section">
      <h2>How many items do you have?</h2>
      <input id="items" type="number" value="1100">
    </div>

    <div id="output" class="results"></div>

  </div>

  <script src="script.js"></script>
</body>
