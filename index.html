<!DOCTYPE html>
<html>
<head>
  <title>PoE Ratio Calculator</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: auto; padding: 20px; }
    input { width: 100%; padding: 8px; margin: 6px 0; }
    button { padding: 10px 20px; margin-top: 10px; }
    .result { margin-top: 20px; padding: 10px; background: #eee; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Path of Exile Ratio Calculator</h1>

    <div class="exchange-box">
      <div class="panel">
        <h2>I WANT</h2>
        <input id="want" type="number" placeholder="Amount you want (e.g., 1)">
      </div>

      <div class="panel">
        <h2>I HAVE</h2>
        <input id="offer" type="number" step="0.01" placeholder="Amount you offer (e.g., 2.8)">
      </div>
    </div>

    <div class="input-row">
      <label>How many items do you have?</label>
      <input id="items" type="number" placeholder="Enter total items (e.g., 1100)">
    </div>

    <button onclick="calculate()">Calculate Trade</button>

    <div id="output" class="result"></div>
  </div>
</body>
</html>
