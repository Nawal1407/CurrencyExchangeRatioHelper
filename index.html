<body>
  <div class="container">
    <h1>Path of Exile Ratio Calculator</h1>

    <div class="ratio-section">
      <h2>Desired Ratio</h2>
      <div class="ratio-inputs">
        <input id="want" type="number" placeholder="I want (e.g., 1)">
        <span>:</span>
        <input id="offer" type="number" step="0.01" placeholder="I have (e.g., 2.8)">
      </div>
    </div>

    <div class="input-row">
      <label>How many items do you have?</label>
      <input id="items" type="number" placeholder="Enter total items (e.g., 1100)">
    </div>

    <button onclick="calculate()">Calculate Trade</button>

    <div id="output" class="result"></div>
  </div>

  <script src="script.js"></script>
</body>
